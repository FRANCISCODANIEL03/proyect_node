<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>
<body>
    <header class="bg-sky-300 flex justify-center p-4 shadow-xl mb-0">
        <img src="./logo.png" alt="logo" width="100px" height="80px">
    </header>

    <main class="flex items-center max-md:flex-col">
        <form id="form" class="bg-sky-100 w-8/12 p-5 lg:w-4/12 mx-30 rounded-xl shadow-lg shadow-blue-300/50">
            <h2 class="text-center font-bold text-xl">Productos</h2>
            <div class="flex flex-col my-3">
                <div class="flex justify-center">
                    <i class="bi bi-emoji-smile mr-2"></i>
                    <label class="text-center font-semibold">Nombre</label>
                </div>
                <input id="name" class="text-center border-2 border-blue-100 border-b-sky-300 focus:border-sky-400 rounded-lg outline-none" 
                type="text" placeholder="Pan tostado">
            </div>
            
        </form>
       
    </main>
    <script src="index.js"></script>
</body>
</html>
