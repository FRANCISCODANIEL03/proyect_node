<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>
<body>
    <header class="bg-sky-300 flex justify-center p-4 shadow-xl mb-0">
        <img src="./logo.png" alt="logo" width="100px" height="80px">
    </header>

    <main class="flex items-center max-md:flex-col">
        <form id="form" class="bg-sky-100 w-8/12 p-5 lg:w-4/12 mx-30 rounded-xl shadow-lg shadow-blue-300/50">
            <h2 class="text-center font-bold text-xl">Productos</h2>
            <div class="flex flex-col my-3">
                <div class="flex justify-center">
                    <i class="bi bi-emoji-smile mr-2"></i>
                    <label class="text-center font-semibold">Nombre</label>
                </div>
                <input id="name" class="text-center border-2 border-blue-100 border-b-sky-300 focus:border-sky-400 rounded-lg outline-none" 
                type="text" placeholder="Pan tostado">
            </div>
            <div class="flex flex-col my-4">
                <div class="flex justify-center">
                    <i class="bi bi-currency-dollar mr-2"></i>
                    <label class="text-center font-semibold">Precio</label>
                </div>
                <input id="price" class="text-center border-2 border-blue-100 border-b-sky-300 focus:border-sky-400 rounded-lg outline-none" 
                type="text" placeholder="$30.25">
            </div>
            <div class="flex flex-col my-4">
                <div class="flex justify-center">
                    <i class="bi bi-database mr-2"></i>
                    <label class="text-center font-semibold">Stock</label>
                </div>
                <input id="stock" class="text-center border-2 border-blue-100 border-b-sky-300 focus:border-sky-400 rounded-lg outline-none" 
                type="text" placeholder="20">
            </div>
            <div class="flex flex-col">
                <button type="submit" class="bg-teal-300 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-102
                 hover:bg-teal-500 px-8 py-1 mb-2 font-bold border-2 border-sky-100 rounded-xl" type="submit">Agregar</button>
                <button type="button" class="bg-sky-300 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-102 
                hover:bg-sky-500 px-8 py-1 mb-2 font-bold border-2 border-sky-100 rounded-xl" type="button">Limpiar</button>
                <p id="msg"></p>
            </div>
        </form>
        <section class="w-7/12 my-5 max-md:w-10/12">
            <h2 class="text-center font-bold text-xl">Lista de productos</h2>
            <ul id="contenedor-cards" class="w-full items-center rounded-lg px-5 py-4 my-5 md:mr-20 flex md:flex-col pt-5 gap-5 
            md:overflow-y-scroll md:h-110 max-md:flex-wrap ">
            </ul>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
